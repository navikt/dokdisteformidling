name: Automerge Dependabot PRs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * MON-FRI'  # Kjør hver arbeidsdag kl 08:00

jobs:
  automerge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: read
    uses: navikt/dok-workflows/.github/workflows/automerge-dependabot-pr.yml@main
    secrets: inherit