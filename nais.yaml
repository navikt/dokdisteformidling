team: teamdokumenthandtering
image: "repo.adeo.no:5443/dok/dokdisteformidling"
replicas:
  min: 1
  max: 2
  cpuThresholdPercentage: 50
port: 8080
healthcheck:
  liveness:
    path: /isAlive
    initialDelay: 30
    failureThreshold: 10
  readiness:
    path: /isReady
    initialDelay: 30
    timeout: 3
leaderElection: true
vault:
  enabled: true
prometheus:
  enabled: true
  path: /actuator/prometheus
resources:
  limits:
    cpu: 3000m
    memory: 3072‬Mi
  requests:
    memory: 1024Mi
fasitResources:
  used:
    - alias: srvdokdisteformidling
      resourceType: credential
      propertyMap:
        username: serviceuser_username
        password: serviceuser_password
    - alias: sftp_privateKey
      resourceType: certificate
      propertyMap:
        password: sftp_privateKeyPassphrase
        keystore: sftp_privateKeyFile
    - alias: dokdisteformidling_config
      resourceType: applicationproperties
    - alias: dokdisteformidling_s3_creds
      resourceType: credential
    - alias: dokdistmellomlager_s3_storage_crypto
      resourceType: credential
    - alias: DokumenttypeInfo_v4
      resourceType: restservice
    - alias: VarselInfo_v1
      resourceType: restservice
    - alias: administrerforsendelse_v1
      resourceType: restservice
    - alias: securityTokenService
      resourceType: baseurl
    - alias: security-token-service-token
      resourceType: restservice
    - alias: dokdisteformidling_channel
      resourceType: channel
      propertyMap:
        name: dokdisteformidling_channel_name
    - alias: mqGateway01
      resourceType: queueManager
    - alias: dokdisteformidling_qdist011_dist_til_dpi
      resourceType: queue
    - alias: dokdisteformidling_qdist011_funk_feil
      resourceType: queue
    - alias: dokdisteformidling_qdist013_dist_trygderetten
      resourceType: queue
    - alias: dokdisteformidling_qdist013_funk_feil
      resourceType: queue
    - alias: dokdistSdpBatchIntern
      resourceType: queue
    - alias: "virksomhet:DigitalKontakinformasjon_v1"
      resourceType: webserviceendpoint
      propertyMap:
        endpointUrl: virksomhet.digitalkontakinformasjon.v1.endpointurl
    - alias: "aktoerregister.api.v1"
      resourceType: restservice
    - alias: "ereg.api"
      resourceType: restservice