kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: {{ APP_NAME }}
  namespace: teamdokumenthandtering
  labels:
    team: teamdokumenthandtering
spec:
  envFrom:
    - secret: {{ DOKDISTEFORMIDLING_SECRET }}
  env:
    - name: JAVA_TRUSTSTORE_OPTIONS
      value: "-Djavax.net.ssl.trustStore=$(NAV_TRUSTSTORE_PATH)
              -Djavax.net.ssl.trustStorePassword=$(NAV_TRUSTSTORE_PASSWORD)"
    - name: JDK_JAVA_OPTIONS
      value: "-Djavax.net.ssl.keyStore=$(NAV_TRUSTSTORE_PATH)
              -Djavax.net.ssl.keyStorePassword=$(NAV_TRUSTSTORE_PASSWORD)
              -Djavax.net.ssl.keyStoreType=jks
               -XX:MaxRAMPercentage=75
               $(JAVA_PROXY_OPTIONS) $(JAVA_TRUSTSTORE_OPTIONS)"
    - name: DOKDISTEFORMIDLING_ENDPOINTS_DOKDISTADMIN_URL
      value: {{ DOKDISTEFORMIDLING_ENDPOINTS_DOKDISTADMIN_URL }}
    - name: DOKDISTEFORMIDLING_ENDPOINTS_DOKDISTADMIN_SCOPE
      value: {{ DOKDISTEFORMIDLING_ENDPOINTS_DOKDISTADMIN_SCOPE }}
    - name: MQGATEWAY01_CHANNEL_SECURENAME
      value: {{ MQGATEWAY01_CHANNEL_SECURENAME }}
    - name: MQGATEWAY01_NAME
      value: {{ MQGATEWAY01_NAME }}
    - name: MQGATEWAY01_HOSTNAME
      value: {{ MQGATEWAY01_HOSTNAME }}
    - name: MQGATEWAY01_PORT
      value: "{{ MQGATEWAY01_PORT }}"
    - name: DOKDISTEFORMIDLING_QDIST013_DIST_TRYGDERETTEN_QUEUENAME
      value: {{ DOKDISTEFORMIDLING_QDIST013_DIST_TRYGDERETTEN_QUEUENAME }}
    - name: DOKDISTEFORMIDLING_QDIST013_FUNK_FEIL_QUEUENAME
      value: {{ DOKDISTEFORMIDLING_QDIST013_FUNK_FEIL_QUEUENAME }}
    - name: DOKDISTDPO_QDIST015_DIST_TIL_DPO_QUEUENAME
      value: {{ DOKDISTDPO_QDIST015_DIST_TIL_DPO_QUEUENAME }}
    - name: DOKDISTEFORMIDLING_ENDPOINTS_EREG_URL
      value: {{ DOKDISTEFORMIDLING_ENDPOINTS_EREG_URL }}
    - name: DOKDISTEFORMIDLING_ENDPOINTS_PDL_URL
      value: {{ DOKDISTEFORMIDLING_ENDPOINTS_PDL_URL }}
    - name: DOKDISTEFORMIDLING_ENDPOINTS_PDL_SCOPE
      value: {{ DOKDISTEFORMIDLING_ENDPOINTS_PDL_SCOPE }}
    - name: DOKDISTEFORMIDLING_ENDPOINTS_SAF_URL
      value: {{ DOKDISTEFORMIDLING_ENDPOINTS_SAF_URL }}
    - name: DOKDISTEFORMIDLING_ENDPOINTS_SAF_SCOPE
      value: {{ DOKDISTEFORMIDLING_ENDPOINTS_SAF_SCOPE }}
  image: {{ image }}
  ingresses:
    - {{ INGRESSES }}
  liveness:
    path: /actuator/health/liveness
    port: 8080
    initialDelay: 30
    failureThreshold: 10
  port: 8080
  prometheus:
    enabled: true
    path: /actuator/prometheus
  readiness:
    path: /actuator/health/readiness
    port: 8080
    initialDelay: 30
    timeout: 3
  replicas:
    min: {{ MIN_REPLICAS }}
    max: {{ MAX_REPLICAS }}
    cpuThresholdPercentage: 50
  resources:
    limits:
      memory: {{ MEMORY_LIMITS }}
    requests:
      cpu: 60m
      memory: {{ MEMORY_REQUESTS }}
  azure:
    application:
      enabled: true
  webproxy: true
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
