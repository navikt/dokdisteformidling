spring.main.banner_mode=off
spring.http.client.factory=simple

# server
server.shutdown=graceful
# actuators
management.endpoints.web.exposure.include=prometheus,health
# actuator - health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always
management.endpoint.health.group.liveness.include=jms
# actuator - metrics
management.endpoint.prometheus.enabled=true
management.metrics.enable.http.client.requests=false

altinn.brokerserviceexternal.readtimeoutms=30000
altinn.brokerserviceexternal.connecttimeoutms=5000

# 10 min
altinn.brokerserviceexternalstreamed.readtimeoutms=600000
altinn.brokerserviceexternalstreamed.connecttimeoutms=5000
